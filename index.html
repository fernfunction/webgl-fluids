<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#05060a" />
    <title>Fluid Sandbox · WebGL2</title>
  </head>
  <body>
    <canvas id="sim"></canvas>

    <!-- aviso que só aparece se WebGL2/float falhar -->
    <div id="unsupported" hidden>
      <div class="card">
        <h1>Oops, incompatible GPU</h1>
        <p id="unsupported-msg"></p>
      </div>
    </div>

    <button id="toggle-panel" aria-label="Mostrar/ocultar controles"></button>

    <!-- painel de controles, preenchido pelo src/ui.ts -->
    <aside id="panel"></aside>

    <div id="fps"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
